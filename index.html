<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="Build a calculator using Operators & Functions">
    <title>Simply Build a calculator using Operators & Functions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>
<body>

    <div class="calc-container">
        <h2>Calculator</h2>
        <!-- Input display for user numbers -->
        <input type="text" id="display" readonly placeholder="0">

        <div class="button-grid">
            <!-- Row 1 -->
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')">/</button>

            <!-- Row 2 -->
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')">*</button>

            <!-- Row 3 -->
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')">-</button>

            <!-- Row 4 -->
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendToDisplay('+')">+</button>

            <!-- Assignment Specific: Square and Cube -->
            <button class="extra" onclick="getSquare()">x²</button>
            <button class="extra" onclick="getCube()">x³</button>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
